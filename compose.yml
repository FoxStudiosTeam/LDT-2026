  #   volumes:
  #     - bag_data:/app/dataset:ro
  #   command: >
  #     bash -c "
  #       echo '► [DATASET] Поехали!' &&
  #       ros2 bag play /app/dataset/doubleT_platform_mcap --loop --read-ahead-queue-size 30
  #     "

  # 0. Утилита для быстрой конвертации багов из .db3 (sqlite3) в .mcap
  # Запуск для всех: docker compose run --rm ros2_converter
  # Запуск для одного: docker compose run --rm ros2_converter python3 /app/dataset/convert_to_mcap.py doubleT_obstacle
  ros2_converter:
    build:
      context: .
      dockerfile: ./dataset/Dockerfile
    container_name: ros2_converter
    volumes:
      - ./dataset:/app/dataset
    command: ["python3", "/app/dataset/convert_to_mcap.py"]

  # 1. Быстрый RAM-плеер (оригинальный)
  ros2_fast_player:
    build:
      context: .
      dockerfile: ./bag_player/Dockerfile
    container_name: ros2_fast_player
    network_mode: "host"
    ipc: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
    env_file:
      - .env
    volumes:
      - ./dataset:/app/dataset:ro
      - ./frames:/frames:ro
    command: ["/app/dataset/cloud_with_fake_obj"]

  # 2. Стрим-ресивер из Windows (для огромных датасетов без копирования)
  # Ждёт запуск в PowerShell: python win_streamer.py <путь_к_багу>
  # ros2_stream_player:
  #   build:
  #     context: .
  #     dockerfile: ./bag_player/Dockerfile
  #   container_name: ros2_stream_player
  #   network_mode: "host"
  #   ipc: "host"
  #   environment:
  #     - ROS_DOMAIN_ID=42
  #     - ROS_LOCALHOST_ONLY=1
  #   env_file:
  #     - .env
  #   command: ["--server"]
    
  # 2. Rust-приложение — без ROS2, чистый ros2-client/rustdds
  rust_viewer:
    build:
      context: .
      dockerfile: ./rust_listener/Dockerfile
    container_name: rust_viewer
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: "host"
    shm_size: '2gb'
    env_file:
      - .env # ⚠️⚠️⚠️ ДОКЕР У МЕНЯ ПОЧЕМУ - ТО ДОСТУЧАТЬСЯ ТОЛЬКО ПО СЕТИ РОУТЕРА
    cap_add:
      - NET_ADMIN
    volumes:
      - ./frames:/frames
    ulimits:
      nofile:
        soft: 1024
        hard: 65535
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
    depends_on:
      - ros2_fast_player
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
 
volumes:
  bag_data:
    external: true
