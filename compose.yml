services:
  # 1. Сервис, который крутит датасет в фоне
  ros2_dataset_player:
    build:
      context: ./dataset
      dockerfile: Dockerfile
    container_name: ros2_dataset_player
    networks:
      - ros_network
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./dataset:/app/dataset:ro

  # 2. Твое Rust-приложение (Вьювер-обработчик)
  rust_viewer:
    build:
      context: ./data-extraction
      dockerfile: Dockerfile
    container_name: rust_viewer
    networks:
      - ros_network
    # Прокидываем порты наружу, чтобы контейнер мог дышать во внешнюю сеть
    ports:
      - "9876:9876"
    # Добавляем шлюз, чтобы host.docker.internal точно разрешался в IP твоей Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ROS_DOMAIN_ID=42
    depends_on:
      - ros2_dataset_player

# Создаем изолированную сеть, внутри которой DDS мультикаст работает без блокировок Windows
networks:
  ros_network:
    driver: bridge
