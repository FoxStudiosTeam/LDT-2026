services:
  # 1. Сервис плеера датасета через ROS2 (проигрывает баг в цикле)
  ros2_dataset_player:
    image: ghcr.io/foxstudiosteam/ldt-2026/ros2_dataset_player:latest
    build:
      context: .
      dockerfile: ./dataset/Dockerfile
    container_name: ros2_dataset_player
    network_mode: "host"
    ipc: "host"
    shm_size: '2gb'
    ulimits:
      nofile:
        soft: 1024
        hard: 65535
    env_file:
      - .env
    environment:
      - ROS_LOCALHOST_ONLY=1
    volumes:
      - ${DATASET_PATH:-./dataset}:/app/dataset:ro
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash
        TARGET=''
        if [ -n \"\$$BAG_NAME\" ] && [ -e \"/app/dataset/\$$BAG_NAME\" ]; then
          TARGET=\"/app/dataset/\$$BAG_NAME\"
        elif [ -f \"/app/dataset/metadata.yaml\" ]; then
          TARGET=\"/app/dataset\"
        else
          FOUND=\$$(find /app/dataset -maxdepth 2 \( -name 'metadata.yaml' -o -name '*.db3' \) 2>/dev/null | head -n 1)
          if [ -n \"\$$FOUND\" ]; then
            if [[ \"\$$FOUND\" == *\"metadata.yaml\"* ]]; then
              TARGET=\"\$$(dirname \"\$$FOUND\")\"
            else
              TARGET=\"\$$FOUND\"
            fi
            echo '► [DATASET] Автовыбор первого найденного датасета: ' \"\$$TARGET\"
            echo '► [DATASET] Чтобы выбрать другой: make play BAG=имя_папки или задайте BAG_NAME'
          fi
        fi
        if [ -z \"\$$TARGET\" ]; then
          echo '❌ [DATASET] Ошибка: датасеты не найдены в /app/dataset!'
          echo '   Поместите .db3 или папку с rosbag2 в папку ./dataset на хосте (или укажите DATASET_PATH в .env).'
          exit 1
        fi
        ARGS=\"\$$BAG_ARGS\"
        if [ -z \"\$$ARGS\" ]; then
          ARGS=\"--loop --read-ahead-queue-size 30\"
        fi
        echo \"► [DATASET] Запуск: ros2 bag play \$$TARGET \$$ARGS\"
        exec ros2 bag play \"\$$TARGET\" \$$ARGS
      "
  ros2_stream_player:
    image: ghcr.io/foxstudiosteam/ldt-2026/ros2_stream_player:latest
    build:
      context: .
      dockerfile: ./bag_player/Dockerfile
    container_name: ros2_stream_player
    network_mode: "host"
    ipc: "host"
    environment:
      - ROS_LOCALHOST_ONLY=1
    env_file:
      - .env
    volumes:
      - ${DATASET_PATH:-./dataset}:/app/dataset:ro
    command: [ "--server" ]
    depends_on:
      - rust_viewer
    
  # 2. Rust-приложение детекции рельсов и препятствий + Rerun + публикация в /rail/error
  rust_viewer:
    image: ghcr.io/foxstudiosteam/ldt-2026/rust_viewer:latest
    build:
      context: .
      dockerfile: ./rust_listener/Dockerfile
    container_name: rust_viewer
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: "host"
    shm_size: '2gb'
    env_file:
      - .env
    ulimits:
      nofile:
        soft: 1024
        hard: 65535
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_ERROR_TOPIC=/rail/error
      - RERUN_URL=rerun+http://host.docker.internal:9876/proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 3. Встроенный Rerun Web Viewer (3D/2D визуализация прямо в браузере: http://127.0.0.1:9090/?url=rerun+http://localhost:9876/proxy)
  # Позволяет жюри и проверяющим просматривать облако точек, рельсы и препятствия без установки Rerun на хост
  rerun_viewer:
    build:
      context: .
      dockerfile: ./rerun_viewer/Dockerfile
    container_name: rerun_viewer
    ports:
      - "9090:9090"
      - "9876:9876"
    environment:
      - RERUN_LOG=info
    restart: unless-stopped

  # 4. Интерактивный 2D Range Image тюнер детектора рельсов (egui Web Panel)
  # Веб-панель доступна в любом браузере: http://localhost:6080
  # Запуск: docker compose up rail_tuner_2d
  rail_tuner_2d:
    image: ghcr.io/foxstudiosteam/ldt-2026/rail_tuner_2d:latest
    build:
      context: .
      dockerfile: ./rail_tuner_2d/Dockerfile
    container_name: rail_tuner_2d
    ports:
      - "6080:6080"
      - "5900:5900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: "host"
    shm_size: '2gb'
    env_file:
      - .env
    environment:
      - RERUN_URL=rerun+http://host.docker.internal:9876/proxy
      - SCREEN_WIDTH=1600
      - SCREEN_HEIGHT=900
      - WINDOW_WIDTH=1600
      - WINDOW_HEIGHT=900
      - WINDOW_MAXIMIZED=false
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - WINIT_UNIX_BACKEND=x11

    volumes:
      - ${DATASET_PATH:-./dataset}:/app/dataset:ro
      - ./frames:/app/frames:ro

  # 5. Rust CLI слушатель топика /rail/error (высокопроизводительный слушатель телеметрии)
  # Запуск: docker compose run --rm rust_error_listener
  # Или в сыром JSON: docker compose run --rm rust_error_listener --raw
  rust_error_listener:
    image: ghcr.io/foxstudiosteam/ldt-2026/rust_error_listener:latest
    build:
      context: .
      dockerfile: ./test_error_listener/Dockerfile
    container_name: rust_error_listener
    network_mode: "host"
    ipc: "host"
    env_file:
      - .env
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_ERROR_TOPIC=/rail/error


