  rust_viewer:
    build:
      context: .
      dockerfile: ./rust_listener/Dockerfile
    container_name: rust_viewer
    network_mode: "host"
    ipc: "host"
    shm_size: '2gb'
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1024
        hard: 65535
    environment:
      ROS_DOMAIN_ID: 42
      ROS_DISTRO: humble
    # depends_on:
    #   - ros2_dataset_player
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
