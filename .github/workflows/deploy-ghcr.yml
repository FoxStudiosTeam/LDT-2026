name: Deploy Container Images to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Image to build and deploy (all, rust_viewer, rail_tuner_2d, rust_error_listener, ros2_stream_player, ros2_dataset_player)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rust_viewer
          - rail_tuner_2d
          - rust_error_listener
          - ros2_stream_player
          - ros2_dataset_player
      custom_tag:
        description: 'Optional additional tag to attach (e.g. dev, rc1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust_viewer
            dockerfile: ./rust_listener/Dockerfile
            context: .
            description: "High-performance Rust LiDAR Rail & Obstacle Detector with Rerun streaming"
          - name: rail_tuner_2d
            dockerfile: ./rail_tuner_2d/Dockerfile
            context: .
            description: "Interactive 2D Range Image Rail Detector & Extrapolation Tuner Web Panel"
          - name: rust_error_listener
            dockerfile: ./test_error_listener/Dockerfile
            context: .
            description: "Rust CLI Diagnostic Listener for /rail/error topic"
          - name: ros2_stream_player
            dockerfile: ./bag_player/Dockerfile
            context: .
            description: "ROS2 Bag Stream Player Service"
          - name: ros2_dataset_player
            dockerfile: ./dataset/Dockerfile
            context: .
            description: "ROS2 Dataset Loop Player Service"

    steps:
      - name: Check target selection
        id: filter
        run: |
          EVENT_NAME="${{ github.event_name }}"
          TARGET="${{ inputs.target || github.event.inputs.target }}"
          MATRIX_NAME="${{ matrix.name }}"

          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "$MATRIX_NAME" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        if: steps.filter.outputs.should_run == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.custom_tag || github.event.inputs.custom_tag }},enable=${{ (inputs.custom_tag || github.event.inputs.custom_tag) != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push container image
        if: steps.filter.outputs.should_run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}