name: Release rail_tuner_2d binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Must already exist or be created manually.'
        required: true
        type: string

permissions:
  contents: write  # нужно для создания Release и загрузки ассетов

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rail_tuner_2d (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── системные зависимости (egui требует X11 / GL headers для линковки) ──
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      # ── Rust toolchain (берёт версию из rust-toolchain.toml) ──
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── кэш Cargo для ускорения повторных сборок ──
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-cargo-release-rail_tuner_2d-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-rail_tuner_2d-
            ${{ runner.os }}-cargo-release-

      # ── собственно сборка ──
      - name: Build rail_tuner_2d (release)
        run: cargo build --release -p rail_tuner_2d

      # ── стрип и переименование в читаемое имя ──
      - name: Prepare binary artifact
        run: |
          BINARY=target/release/rail_tuner_2d
          strip "$BINARY"
          cp "$BINARY" rail_tuner_2d-linux-x86_64

      # ── определяем тег: из push-события или из workflow_dispatch инпута ──
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # ── создаём/обновляем Release и загружаем бинарь ──
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}   # v1.0.0-rc1 → prerelease
          generate_release_notes: true
          files: rail_tuner_2d-linux-x86_64
