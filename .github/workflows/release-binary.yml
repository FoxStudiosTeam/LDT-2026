name: Release rail_tuner_2d binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Must already exist or be created manually.'
        required: true
        type: string

permissions:
  contents: write  # нужно для создания Release и загрузки ассетов

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rail_tuner_2d (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            artifact: rail_tuner_2d-linux-x86_64

          - name: windows-x86_64
            runner: windows-2022
            artifact: rail_tuner_2d-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux: системные зависимости (egui требует X11 / GL headers для линковки) ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      # ── Windows: Visual C++ Build Tools уже предустановлены на windows-2022 ──
      # ── Дополнительно убеждаемся, что Strawberry Perl (openssl) и NASM на PATH ──
      - name: Set up OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # ── Rust toolchain (берёт версию из rust-toolchain.toml) ──
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── кэш Cargo для ускорения повторных сборок ──
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-rail_tuner_2d-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-rail_tuner_2d-
            ${{ runner.os }}-cargo-release-

      # ── сборка ──
      - name: Build rail_tuner_2d (release)
        run: cargo build --release -p rail_tuner_2d

      # ── подготовка артефакта: Linux ──
      - name: Prepare binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/rail_tuner_2d
          cp target/release/rail_tuner_2d ${{ matrix.artifact }}

      # ── подготовка артефакта: Windows ──
      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\release\rail_tuner_2d.exe ${{ matrix.artifact }}

      # ── определяем тег ──
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # ── создаём/обновляем Release и загружаем бинарь ──
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}   # v1.0.0-rc1 → prerelease
          generate_release_notes: true
          files: ${{ matrix.artifact }}
