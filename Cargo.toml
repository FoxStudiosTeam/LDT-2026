[workspace]
members = [
    "cuda-pipeline",
    "rust_listener",
    "data-extraction",
    "large_processor",
    "shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cuda-pipeline = { path = "cuda-pipeline" }
ros2_data_extraction = { path = "data-extraction" }
shared = {path = "shared"}
large_processor = {path = "large_processor"}
