[package]
name = "rust_listener"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ros2_debug_viewer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
rerun = "0.37.2"

cuda-pipeline.workspace = true
ros2_data_extraction.workspace = true
shared.workspace = true
kaiv_utils.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
