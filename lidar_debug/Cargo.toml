[package]
name = "lidar_debug"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lidar_debug"
path = "src/main.rs"

[dependencies]
rusqlite  = { version = "0.31", features = ["bundled"] }
nalgebra  = "0.33"
rand      = "0.8"
anyhow    = "1.0"
bincode   = "1.3"
serde     = { version = "1.0", features = ["derive"] }
memmap2   = "0.9"
rerun     = { version = "0.19", features = ["sdk"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = true
